<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Spectro Art</title>
<style>
:root{
  --bg:#0d0c11; --panel:#16141b; --panel2:#1e1b25; --line:#2a2633;
  --ink:#c9c3d1; --dim:#7d7689; --accent:#d4a574; --warn:#d98b6a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font:11px/1.3 -apple-system,"SF Pro Text",system-ui,sans-serif;
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#app{display:flex;flex-direction:column;height:100%;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

header{display:flex;align-items:center;gap:8px;padding:4px 10px 3px;flex:none}
#vsw{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;flex:none}
#vsw button{font:inherit;font-size:10.5px;color:var(--dim);background:var(--panel2);border:0;padding:3px 9px;touch-action:manipulation}
#vsw button+button{border-left:1px solid var(--line)}
#vsw button.on{color:var(--accent);background:#2a2230}
header .ttl{white-space:nowrap;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--ink)}
header .deco{white-space:nowrap;font-size:11px;color:var(--dim)}
header #srcname{margin-left:auto;color:var(--dim);font-size:10px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:34%}
.chip{font:inherit;font-size:10px;color:var(--dim);background:var(--panel2);border:1px solid var(--line);border-radius:4px;
  padding:3px 7px;flex:none;white-space:nowrap;touch-action:manipulation}
/* full screen: just the plate — header, transport and deck step aside */
body.fs header,body.fs #transport,body.fs #deck{display:none}
#fsBar{display:none;position:absolute;right:6px;bottom:6px;gap:4px;z-index:3;opacity:.4;transition:opacity .2s}
#fsBar:active,#fsBar:hover{opacity:.9}
body.fs #fsBar{display:flex}

#view{position:relative;flex:1;min-height:0}
#cv{position:absolute;top:0;left:0;width:100%;height:100%;display:block;touch-action:none}
#pcv{position:absolute;left:0;top:0;width:100%;display:block;touch-action:none}
body.vplate .sv{display:none}
body:not(.vplate) .pv{display:none}
.b.s{height:20px;padding:0 7px;font-size:10px}
.b.on{background:#3a2f22;border-color:var(--accent);color:var(--accent)}
#snapOv{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(10,9,13,.94);display:none;
  flex-direction:column;align-items:center;justify-content:center;z-index:50}
#snapOv img{max-width:94%;max-height:82%;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
#snapOv div{color:var(--dim);font-size:10px;margin-top:10px}
#hud{position:absolute;left:8px;right:8px;top:1px;height:16px;line-height:16px;
  font:10px ui-monospace,Menlo,monospace;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;color:var(--dim);pointer-events:none}
#hud .w{color:var(--warn)}

#transport{display:flex;align-items:center;gap:3px;padding:4px 5px;overflow-x:auto;scrollbar-width:none;flex:none;
  border-top:1px solid var(--line);background:var(--panel)}
#tm{margin-left:auto;font:10px ui-monospace,Menlo,monospace;color:var(--dim);white-space:nowrap}
.b{height:26px;padding:0 5px;white-space:nowrap;flex:none;font-size:10.5px;font:inherit;font-size:11px;color:var(--ink);
  background:var(--panel2);border:1px solid var(--line);border-radius:4px;
  touch-action:manipulation;cursor:pointer}
.b:active{background:#2a2633}
.b.p{border-color:#6b5740;color:var(--accent)}
.b[disabled]{opacity:.45}
.auto{display:flex;align-items:center;gap:4px;color:var(--dim);font-size:10px}
.auto input{margin:0}

#deck{flex:none;max-height:30vh;display:flex;flex-direction:column;
  background:var(--panel);border-top:1px solid var(--line)}
#tabs{display:flex;height:26px;flex:none;align-items:stretch;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;white-space:nowrap;padding:0 8px;border:0;background:transparent;color:var(--dim);
  font:inherit;font-size:11px;border-bottom:2px solid transparent;touch-action:manipulation}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
#fold{margin-left:auto;flex:0 0 34px;width:34px;border:0;position:sticky;right:0;background:var(--panel);color:var(--dim);font-size:12px}
#body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 10px 8px}
#deck.collapsed #body{display:none}
.pane{display:none;grid-template-columns:1fr 1fr;gap:5px 14px;align-content:start}
.pane.on{display:grid}
.wide{grid-column:1/-1}
.row{display:flex;gap:6px;flex-wrap:wrap}
.c .l{display:flex;justify-content:space-between;color:var(--dim);font-size:10px;margin-bottom:1px}
.c .l b{font-weight:400;color:var(--ink);font-family:ui-monospace,Menlo,monospace}
.c.ck{display:flex;align-items:center;gap:6px;color:var(--ink);font-size:11px;min-height:26px}
.c.ck input{margin:0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;
  background:transparent;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:#3a3544;border-radius:1px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;
  margin-top:-6px;border-radius:50%;background:var(--accent);border:0}
input[type=range]::-moz-range-track{height:2px;background:#3a3544}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:0}
select{width:100%;height:24px;font:inherit;font-size:11px;color:var(--ink);
  background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 4px}
#prev{display:block;width:100%;height:64px;border:1px solid var(--line);border-radius:3px;background:#000}
.note{color:var(--dim);font-size:10px}
#statGrid{display:grid;grid-template-columns:1fr 1fr;gap:1px 14px}
#statGrid div{display:flex;justify-content:space-between;gap:6px;font-size:10px;color:var(--dim);
  border-bottom:1px solid #211e29;padding:1px 0;min-width:0}
#statGrid b{font-weight:400;color:var(--ink);font-family:ui-monospace,Menlo,monospace;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#avg{display:block;width:100%;height:72px;border:1px solid var(--line);border-radius:3px;background:#000}
#peaks{font:10px/1.4 ui-monospace,Menlo,monospace;color:var(--ink);white-space:pre;overflow-x:auto}
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="vsw"><button data-v="plate" class="on">Plate</button><button data-v="spectro">Spectro</button></div>
    <span class="ttl">Spectro Art</span><span class="deco">音画 · 砂</span>
    <span id="srcname"></span>
    <button class="chip pv" id="bFull">Full</button>
  </header>

  <div id="view"><canvas id="cv"></canvas><canvas id="pcv"></canvas><div id="hud"></div><div id="fsBar"><button class="chip" id="fsSnap">Snap</button><button class="chip" id="fsExit">Exit full screen</button></div></div>

  <div id="transport">
    <button class="b p" id="bPlay">Play</button>
    <button class="b sv" id="bEnc">Encode</button>
    <button class="b" id="bMic">Mic</button>
    <button class="b" id="bFile">Load</button>
    <button class="b pv" id="bHold">Hold</button>
    <button class="b pv" id="bScat">Scatter</button>
    <button class="b pv" id="bWipe">Wipe</button>
    <button class="b pv" id="bSend">To image</button>
    <button class="b" id="bSnap">Snap</button>
    <label class="auto sv"><input type="checkbox" id="auto">Auto</label>
    <span id="tm" class="sv">0.0 / 0.0 s</span>
  </div>

  <div id="deck">
    <div id="tabs"></div>
    <div id="body"></div>
  </div>
</div>

<input type="file" id="fImg" accept="image/*" hidden>
<input type="file" id="fAud" accept="audio/*,video/*,.mp3,.m4a,.aac,.wav,.ogg,.flac,.mp4,.mov" hidden>
<div id="snapOv"><img id="snapImg" alt="snapshot"><div>Long-press to save · tap outside to close</div></div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'), g=cv.getContext('2d');

/* ───────── controls ───────── */
const PLATE_TABS=['plate','grains','memory'];
const TABS=[['plate','Plate'],['grains','Grains'],['memory','Memory'],['image','Image'],['tones','Tones'],['levels','Levels'],['view','View'],['mic','Mic'],['stats','Stats'],['file','File']];
const OPT_FFT=[['512','512'],['1024','1024'],['2048','2048'],['4096','4096'],['8192','8192']];
const C=[
 // image → matrix
 {tab:'image',k:'invert',t:'Invert image',ty:'check',def:false,cat:'enc'},
 {tab:'image',k:'black',t:'Black point',min:0,max:90,step:1,def:0,cat:'enc',f:v=>v+'%'},
 {tab:'image',k:'white',t:'White point',min:10,max:100,step:1,def:100,cat:'enc',f:v=>v+'%'},
 {tab:'image',k:'gamma',t:'Input curve',min:.3,max:3,step:.05,def:1,cat:'enc',f:v=>(+v).toFixed(2)},
 // tone bank
 {tab:'tones',k:'dur',t:'Duration',min:2,max:40,step:.5,def:12,cat:'enc',f:v=>(+v).toFixed(1)+' s'},
 {tab:'tones',k:'tones',t:'Tones (image rows)',min:16,max:400,step:1,def:128,cat:'enc'},
 {tab:'tones',k:'cols',t:'Columns (image time steps)',min:16,max:512,step:1,def:256,cat:'enc'},
 {tab:'tones',k:'fLo',t:'Lowest tone',min:50,max:12000,step:10,def:200,cat:'enc',f:v=>v+' Hz'},
 {tab:'tones',k:'fHi',t:'Highest tone',min:200,max:16000,step:10,def:8000,cat:'enc',f:v=>v+' Hz'},
 {tab:'tones',k:'fscale',t:'Tone spacing',ty:'select',opts:[['lin','Linear'],['log','Logarithmic']],def:'lin',cat:'enc'},
 {tab:'tones',k:'phase',t:'Tone phase',ty:'select',opts:[['rand','Random'],['zero','Aligned']],def:'rand',cat:'enc'},
 // levels
 {tab:'levels',k:'amp',t:'Brightness to loudness',ty:'select',opts:[['db','Decibel-linear'],['lin','Linear amplitude']],def:'db',cat:'enc'},
 {tab:'levels',k:'range',t:'Encode range',min:12,max:90,step:1,def:48,cat:'enc',f:v=>v+' dB'},
 {tab:'levels',k:'level',t:'Output level',min:.1,max:1,step:.01,def:.9,cat:'enc',f:v=>(+v).toFixed(2)},
 {tab:'levels',k:'fade',t:'Edge fade',min:0,max:500,step:5,def:30,cat:'enc',f:v=>v+' ms'},
 // view
 {tab:'view',k:'fft',t:'FFT size',ty:'select',opts:OPT_FFT,def:'2048',cat:'fft'},
 {tab:'view',k:'frames',t:'Time columns',min:200,max:2400,step:50,def:1200,cat:'fft'},
 {tab:'view',k:'vrange',t:'Display range',min:20,max:100,step:1,def:60,cat:'paint',f:v=>v+' dB'},
 {tab:'view',k:'vgamma',t:'Display curve',min:.3,max:3,step:.05,def:1,cat:'paint',f:v=>(+v).toFixed(2)},
 {tab:'view',k:'cmap',t:'Colour map',ty:'select',opts:[['magma','Magma'],['inferno','Inferno'],['gray','Gray']],def:'magma',cat:'paint'},
 {tab:'view',k:'cinv',t:'Reverse colours',ty:'check',def:false,cat:'paint'},
 {tab:'view',k:'vfit',t:'Fit view to tone band',ty:'check',def:true,cat:'paint'},
 {tab:'view',k:'vscale',t:'Frequency axis',ty:'select',opts:[['lin','Linear'],['log','Logarithmic']],def:'lin',cat:'paint'},
 {tab:'view',k:'vLo',t:'View low',min:0,max:20000,step:50,def:0,cat:'paint',f:v=>v+' Hz'},
 {tab:'view',k:'vHi',t:'View high',min:500,max:22050,step:50,def:9000,cat:'paint',f:v=>v+' Hz'},
 {tab:'view',k:'grid',t:'Grid lines',ty:'check',def:false,cat:'draw'},
 {tab:'view',k:'reveal',t:'Reveal while playing',ty:'check',def:true,cat:'draw'},
 // live mic
 {tab:'mic',k:'lwin',t:'Window',min:3,max:60,step:1,def:15,cat:'live',f:v=>v+' s'},
 {tab:'mic',k:'lhop',t:'Update interval',min:10,max:100,step:5,def:30,cat:'live',f:v=>v+' ms'},
 {tab:'mic',k:'lceil',t:'Top level',min:-90,max:0,step:1,def:-20,cat:'paint',f:v=>v+' dBFS'},
 {tab:'mic',k:'lsmooth',t:'Smoothing',min:0,max:.9,step:.05,def:0,cat:'draw',f:v=>(+v).toFixed(2)},
 {tab:'mic',k:'lmax',t:'Max recording',min:10,max:600,step:10,def:120,cat:'draw',f:v=>v+' s'},
 {tab:'mic',k:'lraw',t:'Raw input (no auto-gain, no noise cut)',ty:'check',def:true,cat:'live'},
 {tab:'mic',k:'lfreeze',t:'Freeze display',ty:'check',def:false,cat:'draw'},
 // plate (Chladni) — cat 'plate' routes to PLATE.set(key without 'pl_')
 {tab:'plate',k:'pl_shape',t:'Shape',ty:'select',opts:[['square','Square'],['rect','Rectangle'],['circle','Circle']],def:'square',cat:'plate'},
 {tab:'plate',k:'pl_material',t:'Material',ty:'select',opts:[['steel','Steel'],['brass','Brass'],['aluminium','Aluminium'],['glass','Glass']],def:'steel',cat:'plate'},
 {tab:'plate',k:'pl_pitch',t:'Mode pitches',ty:'select',opts:[['physical','From material'],['manual','Manual (lowest mode)']],def:'physical',cat:'plate'},
 {tab:'plate',k:'pl_f0',t:'Lowest mode (manual)',min:10,max:400,step:1,def:60,cat:'plate',f:v=>v+' Hz'},
 {tab:'plate',k:'pl_size',t:'Size (side or diameter)',min:5,max:80,step:.5,def:24,cat:'plate',f:v=>v+' cm'},
 {tab:'plate',k:'pl_thick',t:'Thickness',min:.2,max:6,step:.05,def:1,cat:'plate',f:v=>(+v).toFixed(2)+' mm'},
 {tab:'plate',k:'pl_mu',t:'Poisson μ',min:0,max:.45,step:.005,def:.29,cat:'plate',f:v=>(+v).toFixed(3)},
 {tab:'plate',k:'pl_Q',t:'Resonance Q',min:2,max:200,step:1,def:14,cat:'plate'},
 {tab:'plate',k:'pl_order',t:'Mode order',min:4,max:12,step:1,def:9,cat:'plate'},
 {tab:'plate',k:'pl_aspect',t:'Aspect (rectangle)',min:.3,max:1,step:.01,def:.7,cat:'plate',f:v=>(+v).toFixed(2)},
 {tab:'plate',k:'pl_gate',t:'Gate',min:-120,max:-30,step:1,def:-80,cat:'plate',f:v=>v+' dB'},
 {tab:'plate',k:'pl_range',t:'Range',min:20,max:90,step:1,def:50,cat:'plate',f:v=>v+' dB'},
 {tab:'plate',k:'pl_gain',t:'Gain',min:.1,max:4,step:.01,def:1.2,cat:'plate',f:v=>(+v).toFixed(2)},
 {tab:'plate',k:'pl_peaks',t:'Peaks used',min:1,max:6,step:1,def:2,cat:'plate'},
 {tab:'plate',k:'pl_smooth',t:'Smoothing',min:0,max:.97,step:.01,def:.6,cat:'plate',f:v=>(+v).toFixed(2)},
 {tab:'plate',k:'pl_fmin',t:'Low cut',min:10,max:500,step:1,def:30,cat:'plate',f:v=>v+' Hz'},
 {tab:'plate',k:'pl_fmax',t:'High cut',min:500,max:8000,step:10,def:3000,cat:'plate',f:v=>v+' Hz'},
 {tab:'plate',k:'pl_tone',t:'Test tone into the plate',ty:'check',def:false,cat:'plate'},
 {tab:'plate',k:'pl_toneOut',t:'Test tone audible',ty:'check',def:false,cat:'plate'},
 {tab:'plate',k:'pl_toneHz',t:'Test tone',min:30,max:2000,step:1,def:220,cat:'plate',f:v=>v+' Hz'},
 {tab:'grains',k:'pl_count',t:'Grains',min:1000,max:15000,step:500,def:6000,cat:'plate'},
 {tab:'grains',k:'pl_powder',t:'Powder',min:0,max:60,step:1,def:15,cat:'plate',f:v=>v+'%'},
 {tab:'grains',k:'pl_launch',t:'Launch',min:0,max:1.5,step:.01,def:.18,cat:'plate',f:v=>(+v).toFixed(2)},
 {tab:'grains',k:'pl_bounce',t:'Bounce',min:0,max:40,step:.5,def:12,cat:'plate',f:v=>(+v).toFixed(1)},
 {tab:'grains',k:'pl_drift',t:'Drift',min:0,max:150,step:1,def:30,cat:'plate'},
 {tab:'grains',k:'pl_settle',t:'Settle',min:.05,max:.95,step:.01,def:.35,cat:'plate',f:v=>(+v).toFixed(2)},
 {tab:'grains',k:'pl_ribs',t:'Ribs (König)',min:0,max:150,step:1,def:40,cat:'plate'},
 {tab:'grains',k:'pl_grain',t:'Grain size',min:1,max:4,step:1,def:2,cat:'plate',f:v=>v+' px'},
 {tab:'grains',k:'pl_field',t:'Field glow',min:0,max:1,step:.01,def:0,cat:'plate',f:v=>(+v).toFixed(2)},
 {tab:'grains',k:'pl_strip',t:'Mode strip under the plate',ty:'check',def:true,cat:'plate'},
 // dual memory — vibration memory (field) and sand aging (grains)
 {tab:'memory',k:'pl_memory',t:'Vibration memory',ty:'check',def:true,cat:'plate'},
 {tab:'memory',k:'pl_sandMemory',t:'Sand aging',ty:'check',def:true,cat:'plate'},
 {tab:'memory',k:'pl_memPalette',t:'Memory colours',ty:'select',opts:[['spectro','Spectro colour map'],['original','Dual memory (original)']],def:'spectro',cat:'plate'},
 {tab:'memory',k:'pl_memCell',t:'Memory cell size',min:1,max:8,step:1,def:2,cat:'plate',f:v=>v+' px'},
 {tab:'memory',k:'pl_memCeil',t:'Colour ceiling',min:.3,max:1,step:.01,def:.82,cat:'plate',f:v=>(+v).toFixed(2)},
 {tab:'memory',k:'pl_memScale',t:'Activity scale',min:.2,max:6,step:.05,def:2,cat:'plate',f:v=>(+v).toFixed(2)},
 {tab:'memory',k:'pl_memRise',t:'Adapt rise rate',min:.05,max:10,step:.05,def:2.2,cat:'plate',f:v=>(+v).toFixed(2)+'/s'},
 {tab:'memory',k:'pl_memFall',t:'Adapt fall rate',min:.01,max:5,step:.01,def:.28,cat:'plate',f:v=>(+v).toFixed(2)+'/s'},
 {tab:'memory',k:'pl_memNovelty',t:'Novelty gain',min:0,max:10,step:.05,def:3.2,cat:'plate',f:v=>(+v).toFixed(2)},
 {tab:'memory',k:'pl_memOnset',t:'Onset bonus',min:0,max:2,step:.01,def:.25,cat:'plate',f:v=>(+v).toFixed(2)},
 {tab:'memory',k:'pl_memCharge',t:'Charge rate',min:0,max:6,step:.01,def:1.45,cat:'plate',f:v=>(+v).toFixed(2)+'/s'},
 {tab:'memory',k:'pl_memDrain',t:'Drain rate',min:0,max:2,step:.01,def:.19,cat:'plate',f:v=>(+v).toFixed(2)+'/s'},
 {tab:'memory',k:'pl_memAlpha',t:'Colour ramp',min:.1,max:3,step:.01,def:.92,cat:'plate',f:v=>(+v).toFixed(2)},
 {tab:'memory',k:'pl_memOpacity',t:'Max opacity',min:0,max:1,step:.01,def:.78,cat:'plate',f:v=>(+v).toFixed(2)},
 {tab:'memory',k:'pl_ageTime',t:'Darken time',min:2,max:180,step:1,def:34,cat:'plate',f:v=>v+' s'},
 {tab:'memory',k:'pl_ageTravel',t:'Reset distance',min:.002,max:.06,step:.001,def:.012,cat:'plate',f:v=>(+v).toFixed(3)},
 {tab:'memory',k:'pl_powderAge',t:'Powder ages too',ty:'check',def:false,cat:'plate'},
];
const P={}, reg={};

function mk(c){
  P[c.k]=c.def;
  const ty=c.ty||'range';
  const wrap=document.createElement(ty==='check'?'label':'div');
  wrap.className='c'+(ty==='check'?' ck':'');
  let el,vEl=null;
  if(ty==='check'){
    el=document.createElement('input'); el.type='checkbox'; el.checked=!!c.def;
    const s=document.createElement('span'); s.textContent=c.t;
    wrap.append(el,s);
    el.addEventListener('change',()=>{P[c.k]=el.checked;hit(c,true)});
  }else if(ty==='select'){
    wrap.innerHTML='<div class="l"><span></span></div>';
    wrap.firstChild.firstChild.textContent=c.t;
    el=document.createElement('select');
    for(const [v,n] of c.opts){const o=document.createElement('option');o.value=v;o.textContent=n;el.appendChild(o);}
    el.value=c.def; wrap.appendChild(el);
    el.addEventListener('change',()=>{P[c.k]=el.value;hit(c,true)});
  }else{
    wrap.innerHTML='<div class="l"><span></span><b></b></div>';
    wrap.firstChild.firstChild.textContent=c.t;
    vEl=wrap.firstChild.lastChild;
    el=document.createElement('input'); el.type='range';
    el.min=c.min; el.max=c.max; el.step=c.step; el.value=c.def;
    const fmt=c.f||(v=>v);
    vEl.textContent=fmt(c.def);
    el.addEventListener('input',()=>{P[c.k]=+el.value;vEl.textContent=fmt(+el.value);hit(c,false)});
    el.addEventListener('change',()=>hit(c,true));
    wrap.appendChild(el);
  }
  reg[c.k]={c,el,vEl};
  return wrap;
}
function setParam(k,v){
  const r=reg[k]; P[k]=v;
  if(r.el.type==='checkbox') r.el.checked=!!v; else r.el.value=v;
  if(r.vEl) r.vEl.textContent=(r.c.f||(x=>x))(v);
}
function hit(c,final){
  if(c.cat==='plate'){
    const k=c.k.slice(3);
    if((k==='tone'||k==='toneOut')&&P[c.k]) ensureCtx();
    PLATE.set(k,P[c.k]);
    if(k==='material') setParam('pl_mu',PLATE.P.mu);
    if(k==='shape'||k==='aspect'||k==='strip') layout();
    return;
  }
  if(c.cat==='enc') markStale();
  else if(c.cat==='fft'){ if(final){ if(live) reconfigureLive(); else analyze(); } }
  else if(c.cat==='live'){ if(final) liveParamChanged(c.k); }
  else if(c.cat==='paint') schedulePaint();
  else draw();
}

/* ───────── source image ───────── */
function resample(src,sw,sh,tw,th){
  let cc=src,cw=sw,ch=sh;
  for(;;){
    const nw=cw>tw*2?Math.ceil(cw/2):tw, nh=ch>th*2?Math.ceil(ch/2):th;
    const c=document.createElement('canvas'); c.width=nw; c.height=nh;
    const x=c.getContext('2d'); x.imageSmoothingEnabled=true; x.imageSmoothingQuality='high';
    x.fillStyle='#000'; x.fillRect(0,0,nw,nh); x.drawImage(cc,0,0,cw,ch,0,0,nw,nh);
    cc=c; cw=nw; ch=nh;
    if(cw===tw&&ch===th) break;
  }
  return cc;
}
function setSource(img,name){
  const w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
  const s=Math.min(1,1024/Math.max(w,h));
  srcCv=resample(img,w,h,Math.max(1,Math.round(w*s)),Math.max(1,Math.round(h*s)));
  $('srcname').textContent=name;
  updatePreview(); markStale();
}

/* ───────── image → matrix ───────── */
function buildMatrix(){
  const R=+P.tones, Cc=+P.cols;
  const sm=resample(srcCv,srcCv.width,srcCv.height,Cc,R);
  const d=sm.getContext('2d').getImageData(0,0,Cc,R).data;
  const M=new Float32Array(R*Cc);
  const b=P.black/100, w=Math.max(P.white/100,b+.02), gm=+P.gamma;
  for(let i=0;i<R*Cc;i++){
    const l=(0.2126*d[4*i]+0.7152*d[4*i+1]+0.0722*d[4*i+2])/255;
    let v=(l-b)/(w-b); v=v<0?0:v>1?1:v;
    if(P.invert) v=1-v;
    if(gm!==1) v=Math.pow(v,gm);
    M[i]=v;
  }
  return {M,R,C:Cc};
}
function updatePreview(){
  if(!srcCv) return;
  const m=buildMatrix(), pc=$('prev'); pc.width=m.C; pc.height=m.R;
  const x=pc.getContext('2d'), id=x.createImageData(m.C,m.R);
  for(let i=0;i<m.M.length;i++){const v=Math.round(m.M[i]*255);id.data[4*i]=id.data[4*i+1]=id.data[4*i+2]=v;id.data[4*i+3]=255;}
  x.putImageData(id,0,0);
}
function markStale(){
  stale=true; clearTimeout(prevT); prevT=setTimeout(updatePreview,60); refreshHUD();
  if($('auto').checked){clearTimeout(autoT);autoT=setTimeout(()=>encode(),700);}
}

/* ───────── encoder: image → additive sines ───────── */
function effCfg(){
  const SR=44100;
  let fLo=+P.fLo, fHi=+P.fHi;
  fHi=Math.min(fHi,SR/2-200); fLo=Math.min(fLo,fHi-100);
  return {SR,fLo,fHi,R:+P.tones,Cc:+P.cols,dur:+P.dur,fscale:P.fscale};
}
async function encode(){
  if(!srcCv) return;
  if(live){setHudWarn('stop the mic first');return;}
  if(busy){again=true;return;}
  busy=true; $('bEnc').disabled=true; again=false;
  stopPlay(true);
  const cfg=effCfg(), SR=cfg.SR, R=cfg.R, Cc=cfg.Cc;
  const N=Math.round(cfg.dur*SR), L=N/Cc;
  const {M}=buildMatrix();
  const rangeDb=+P.range;
  const ampOf=P.amp==='db'
    ? v=>v<=0?0:Math.pow(10,(v-1)*rangeDb/20)*Math.min(1,v/0.03)
    : v=>v;
  const out=new Float32Array(N);
  const A=new Float32Array(Cc), Pd=new Float32Array(Cc+2);
  for(let r=0;r<R;r++){
    const fr=R>1?r/(R-1):0;
    const f=cfg.fscale==='log'?cfg.fHi*Math.pow(cfg.fLo/cfg.fHi,fr):cfg.fHi-fr*(cfg.fHi-cfg.fLo);
    let any=false;
    for(let c=0;c<Cc;c++){const a=ampOf(M[r*Cc+c]);A[c]=a;if(a>0)any=true;}
    if(any){
      const w=2*Math.PI*f/SR, k=2*Math.cos(w), ph0=P.phase==='rand'?Math.random()*2*Math.PI:0;
      Pd[0]=A[0]; for(let c=0;c<Cc;c++) Pd[c+1]=A[c]; Pd[Cc+1]=A[Cc-1];
      for(let j=0;j<=Cc;j++){
        const a0=Pd[j], a1=Pd[j+1];
        if(a0===0&&a1===0) continue;
        const sS=(j-.5)*L, sE=(j+.5)*L;
        const s=Math.max(0,Math.ceil(sS)), e=Math.min(N,Math.ceil(sE));
        if(e<=s) continue;
        const slope=(a1-a0)/L;
        let amp=a0+(s-sS)*slope;
        let y1=Math.sin(ph0+w*(s-1)), y2=Math.sin(ph0+w*(s-2));
        for(let n=s;n<e;n++){
          const y=k*y1-y2; out[n]+=amp*y; y2=y1; y1=y; amp+=slope;
        }
      }
    }
    if((r&3)===3){busyMsg='encoding '+Math.round(r/R*100)+'%';refreshHUD();await yieldUI();}
  }
  // fade + normalise
  const nf=Math.min(Math.round(P.fade/1000*SR),N>>1);
  for(let i=0;i<nf;i++){const m=i/nf;out[i]*=m;out[N-1-i]*=m;}
  let pk=0; for(let i=0;i<N;i++){const a=Math.abs(out[i]);if(a>pk)pk=a;}
  const sc=pk>0?(+P.level)/pk:0; for(let i=0;i<N;i++) out[i]*=sc;
  cur={data:out,sr:SR,dur:N/SR,name:'encoded',encoded:true,cfg:{fLo:cfg.fLo,fHi:cfg.fHi,R,Cc,dur:cfg.dur,fscale:cfg.fscale}};
  pos=0; stale=false; busyMsg=''; busy=false; $('bEnc').disabled=false;
  updateTime();
  await analyze();
  if(again){again=false;encode();}
}

/* ───────── STFT ───────── */
const fftCache={};
function getFFT(n){
  if(fftCache[n]) return fftCache[n];
  const rev=new Uint32Array(n), cs=new Float64Array(n/2), sn=new Float64Array(n/2);
  const bits=Math.log2(n)|0;
  for(let i=0;i<n;i++){let r=0,x=i;for(let b=0;b<bits;b++){r=(r<<1)|(x&1);x>>=1;}rev[i]=r;}
  for(let i=0;i<n/2;i++){cs[i]=Math.cos(2*Math.PI*i/n);sn[i]=-Math.sin(2*Math.PI*i/n);}
  const fn=(re,im)=>{
    for(let i=0;i<n;i++){const j=rev[i];if(j>i){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t;}}
    for(let size=2;size<=n;size<<=1){
      const half=size>>1, step=n/size;
      for(let i=0;i<n;i+=size){
        for(let j=0,k=0;j<half;j++,k+=step){
          const a=i+j, b=a+half;
          const tr=re[b]*cs[k]-im[b]*sn[k], ti=re[b]*sn[k]+im[b]*cs[k];
          re[b]=re[a]-tr; im[b]=im[a]-ti; re[a]+=tr; im[a]+=ti;
        }
      }
    }
  };
  fftCache[n]=fn; return fn;
}
async function analyze(){
  if(!cur) return;
  const my=++analyzeId;
  const N=+P.fft, frames=+P.frames, data=cur.data, len=data.length, sr=cur.sr;
  const bins=N/2+1, db=new Float32Array(frames*bins);
  const fft=getFFT(N), win=new Float64Array(N);
  let sum=0; for(let i=0;i<N;i++){win[i]=.5-.5*Math.cos(2*Math.PI*i/N);sum+=win[i];}
  const sc=2/sum, re=new Float64Array(N), im=new Float64Array(N);
  let mx=-1e9;
  for(let f=0;f<frames;f++){
    const center=f*(len-1)/(frames-1), start=Math.round(center-N/2);
    for(let i=0;i<N;i++){const idx=start+i;re[i]=(idx>=0&&idx<len?data[idx]:0)*win[i];im[i]=0;}
    fft(re,im);
    const o=f*bins;
    for(let b=0;b<bins;b++){
      const d=20*Math.log10(Math.sqrt(re[b]*re[b]+im[b]*im[b])*sc+1e-10);
      db[o+b]=d; if(d>mx) mx=d;
    }
    if((f%30)===29){
      busyMsg='analysing '+Math.round(f/frames*100)+'%'; refreshHUD(); await yieldUI();
      if(my!==analyzeId) return;
    }
  }
  for(let i=0;i<db.length;i++) db[i]-=mx;
  spec={db,frames,bins,N,sr,mx}; busyMsg='';
  paintSpec(); draw(); refreshHUD(); refreshStats();
}

/* ───────── colour maps ───────── */
const STOPS={
 magma:[[0,0,4],[28,16,68],[79,18,123],[129,37,129],[181,54,122],[229,80,100],[251,135,97],[254,194,135],[252,253,191]],
 inferno:[[0,0,4],[31,12,72],[85,15,109],[136,34,106],[186,54,85],[227,89,51],[249,140,10],[249,201,50],[252,255,164]],
 gray:[[0,0,0],[255,255,255]]
};
function cmapRGB(name,t){
  const s=STOPS[name], x=t*(s.length-1), i=Math.min(s.length-2,Math.floor(x)), f=x-i;
  return [s[i][0]+(s[i+1][0]-s[i][0])*f, s[i][1]+(s[i+1][1]-s[i][1])*f, s[i][2]+(s[i+1][2]-s[i][2])*f];
}
function makeLUT(){
  const lut=new Uint32Array(256), gm=+P.vgamma;
  for(let i=0;i<256;i++){
    let t=Math.pow(i/255,gm); if(P.cinv) t=1-t;
    const [r,gg,b]=cmapRGB(P.cmap,t);
    lut[i]=(0xFF000000|((b|0)<<16)|((gg|0)<<8)|(r|0))>>>0;
  }
  return lut;
}

/* ───────── layout / spectrogram image ───────── */
// one view at a time, sharing the same screen (like alpha synth's scope modes)
let VIEW='plate';
function layout(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  const r=$('view').getBoundingClientRect(), pH=Math.max(1,Math.round(r.height)), pc=$('pcv');
  const isPlate=VIEW==='plate';
  document.body.classList.toggle('vplate',isPlate);
  $('hud').style.display=isPlate?'none':'';
  cv.style.display=isPlate?'none':'block'; cv.style.height=r.height+'px';
  pc.style.display=isPlate?'block':'none'; pc.style.top='0px'; pc.style.height=pH+'px';
  if(isPlate) PLATE.layout(r.width,pH,dpr,0);
  cv.width=Math.max(20,Math.round(r.width*dpr)); cv.height=Math.max(20,Math.round(r.height*dpr));
  const ml=Math.round(36*dpr), mt=Math.round(18*dpr), mr=Math.round(8*dpr), mb=Math.round(16*dpr);
  plot={x0:ml,y0:mt,w:cv.width-ml-mr,h:cv.height-mt-mb};
  paintSpec(); if(live) rebuildLiveCanvas(); draw();
}
function viewRange(){
  const nyq=live?liveSR/2:(cur?cur.sr/2:22050); let lo,hi;
  if(!live&&P.vfit&&cur&&cur.cfg){
    const pad=(cur.cfg.fHi-cur.cfg.fLo)*.05;
    lo=Math.max(0,cur.cfg.fLo-pad); hi=Math.min(nyq,cur.cfg.fHi+pad);
  }else{lo=+P.vLo;hi=+P.vHi;}
  if(P.vscale==='log') lo=Math.max(lo,20);
  if(hi<=lo+50) hi=lo+50;
  return [lo,hi];
}
function freqAtFrac(fr,fa,fb){ return P.vscale==='log'?fa*Math.pow(fb/fa,fr):fa+(fb-fa)*fr; }
function schedulePaint(){
  if(paintQ) return;
  paintQ=requestAnimationFrame(()=>{paintQ=0;paintSpec();if(live)paintLiveFull();draw();});
}
function paintSpec(){
  if(!spec||!plot||plot.w<2||plot.h<2){specCv=null;return;}
  const w=plot.w,h=plot.h;
  if(!specCv) specCv=document.createElement('canvas');
  specCv.width=w; specCv.height=h;
  const sx=specCv.getContext('2d'), img=sx.createImageData(w,h), u=new Uint32Array(img.data.buffer);
  const [fa,fb]=viewRange(), nyq=spec.sr/2, {db,frames,bins}=spec;
  const rb0=new Int32Array(h), rbw=new Float32Array(h), rok=new Uint8Array(h);
  for(let y=0;y<h;y++){
    const f=freqAtFrac(1-y/(h-1),fa,fb);
    if(f<0||f>nyq){rok[y]=0;continue;}
    rok[y]=1; const bp=f/nyq*(bins-1); let b0=Math.floor(bp); if(b0>bins-2) b0=bins-2;
    rb0[y]=b0; rbw[y]=bp-b0;
  }
  const cf0=new Int32Array(w), cfw=new Float32Array(w);
  for(let x=0;x<w;x++){
    const fp=x/(w-1)*(frames-1); let f0=Math.floor(fp); if(f0>frames-2) f0=frames-2;
    cf0[x]=f0; cfw[x]=fp-f0;
  }
  const rng=+P.vrange, lut=makeLUT(), black=0xFF000000>>>0;
  for(let y=0;y<h;y++){
    const o=y*w;
    if(!rok[y]){for(let x=0;x<w;x++)u[o+x]=black;continue;}
    const b0=rb0[y], bw=rbw[y], bw1=1-bw;
    for(let x=0;x<w;x++){
      const i0=cf0[x]*bins+b0, fw=cfw[x];
      const v=(db[i0]*bw1+db[i0+1]*bw)*(1-fw)+(db[i0+bins]*bw1+db[i0+bins+1]*bw)*fw;
      const t=(v+rng)/rng;
      u[o+x]=lut[t<=0?0:t>=1?255:(t*255)|0];
    }
  }
  sx.putImageData(img,0,0);
}

/* ───────── drawing ───────── */
function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x))),m=x/p;return(m<1.5?1:m<3.5?2:m<7.5?5:10)*p;}
function fmtHz(f){return f>=1000?(+(f/1000).toFixed(2))+'k':String(Math.round(f));}
let axisTicks=[];
function draw(){
  if(!plot) return;
  const W=cv.width,H=cv.height,{x0,y0,w,h}=plot;
  g.setTransform(1,0,0,1,0,0);
  g.fillStyle='#0d0c11'; g.fillRect(0,0,W,H);
  g.fillStyle='#000'; g.fillRect(x0,y0,w,h);
  const dur=live?liveDur():(cur?cur.dur:1);
  if(live){
    if(lcv) g.drawImage(lcv,0,0,lcv.width,lcv.height,x0,y0,w,h);
  }else if(specCv){
    const fr=(playing&&P.reveal)?Math.min(1,pos/dur):1, sw=Math.round(w*fr);
    if(sw>0) g.drawImage(specCv,0,0,sw,h,x0,y0,sw,h);
  }
  if(cur||live){
    const fs=Math.round(9*dpr);
    g.font=fs+'px ui-monospace,Menlo,monospace';
    g.fillStyle='#7d7689'; g.strokeStyle='rgba(212,165,116,.15)'; g.lineWidth=1;
    const [fa,fb]=viewRange(), log=P.vscale==='log';
    const ticks=[];
    if(log){
      for(let p=Math.floor(Math.log10(fa));p<=Math.ceil(Math.log10(fb));p++) for(const m of [1,2,5]){const f=m*Math.pow(10,p);if(f>=fa&&f<=fb)ticks.push(f);}
    }else{
      const step=niceStep((fb-fa)/Math.max(2,h/(26*dpr)));
      for(let f=Math.ceil(fa/step)*step;f<=fb+1e-6;f+=step) ticks.push(f);
    }
    g.textAlign='right'; g.textBaseline='middle';
    for(const f of ticks){
      const fr=log?Math.log(f/fa)/Math.log(fb/fa):(f-fa)/(fb-fa), y=Math.round(y0+(1-fr)*(h-1))+.5;
      g.fillText(fmtHz(f),x0-4*dpr,y);
      g.beginPath(); g.moveTo(x0-3*dpr,y); g.lineTo(P.grid?x0+w:x0,y); g.stroke();
    }
    // plate modes the drive point can excite: brass ticks just inside the axis
    axisTicks=[];
    for(const m of PLATE.axisModes()){
      if(m.f<fa||m.f>fb) continue;
      const fr=log?Math.log(m.f/fa)/Math.log(fb/fa):(m.f-fa)/(fb-fa), y=Math.round(y0+(1-fr)*(h-1))+.5;
      const on=PLATE.P.tone&&Math.abs(PLATE.P.toneHz-m.f)<0.01;
      g.strokeStyle=on?'rgba(240,210,160,.95)':'rgba(212,165,116,'+(0.35+0.5*m.c).toFixed(2)+')';
      g.beginPath(); g.moveTo(x0,y); g.lineTo(x0+(on?14:4+5*m.c)*dpr,y); g.stroke();
      axisTicks.push({y,f:m.f,label:m.label});
    }
    g.strokeStyle='rgba(212,165,116,.15)';
    g.textAlign='center'; g.textBaseline='top';

function refreshHUD(){

    a.textContent=c.dur.toFixed(1)+'s · '+c.R+'×'+c.Cc+' · Δf '+Math.round(dfMin)+' · bin '+bin.toFixed(0)+' Hz · win '+win.toFixed(0)+' · Δt '+dt.toFixed(0)+' ms';

function findPeaks(avgP,sr,N,maxN){
  const bins=avgP.length, dbA=new Float32Array(bins); let mx=-1e9;
  for(let b=0;b<bins;b++){ dbA[b]=10*Math.log10(avgP[b]+1e-18); if(b>=1&&dbA[b]>mx) mx=dbA[b]; }

    const y0=dbA[b-1], y1=dbA[b], y2=dbA[b+1], den=y0-2*y1+y2;

}

      const gx = Math.max(0, Math.min(m0 - 1, (I + 0.5) / m1 * m0 - 0.5)), i0 = Math.min(m0 - 2, Math.floor(gx)), fx = gx - i0;
      const a = src[j0 * m0 + i0], b = src[j0 * m0 + i0 + 1], c = src[(j0 + 1) * m0 + i0], d = src[(j0 + 1) * m0 + i0 + 1];
      out[J * m1 + I] = (a + (b - a) * fx) * (1 - fy) + (c + (d - c) * fx) * fy;
    }
  }
  return out;
}
function fitMemoryGrid() {
  const want = Math.max(MEM_MIN, Math.min(MEM_MAX, Math.round(plate.w * dpr / Math.max(1, P.memCell))));
  if (want === M) return;
  memory = resampleGrid(memory, M, want); adapted = resampleGrid(adapted, M, want);
  M = want; MM = M * M; mc.width = M; mc.height = M; mimg = mctx.createImageData(M, M);
  memTables();
}
memTables();
const MEM_RGB = new Uint8Array(256 * 3);
(function buildMemoryPalette() {   // black -> spectral colour -> white
  const stops = [
    [0.00, 0, 0, 0], [0.12, 49, 16, 92], [0.25, 36, 65, 190],
    [0.38, 20, 177, 220], [0.51, 38, 190, 112], [0.64, 228, 214, 48],
    [0.77, 231, 89, 42], [0.89, 245, 130, 195], [1.00, 255, 255, 255]
  ];
  for (let n = 0; n < 256; n++) {
    const t = n / 255; let a = stops[0], b = stops[stops.length - 1];
    for (let i = 1; i < stops.length; i++) if (t <= stops[i][0]) { a = stops[i - 1]; b = stops[i]; break; }
    const f = (t - a[0]) / (b[0] - a[0]), k = n * 3;
    MEM_RGB[k] = a[1] + (b[1] - a[1]) * f; MEM_RGB[k + 1] = a[2] + (b[2] - a[2]) * f; MEM_RGB[k + 2] = a[3] + (b[3] - a[3]) * f;
  }
})();
function updateMemory(dt) {
  dt = Math.max(0, Math.min(0.05, dt));
  fitMemoryGrid();
  const g2 = P.gain * P.gain, sc = 1 / Math.max(0.01, P.memScale);
  const kRise = 1 - Math.exp(-P.memRise * dt), kFall = 1 - Math.exp(-P.memFall * dt);
  const nov = P.memNovelty, ons = P.memOnset, chg = P.memCharge * dt, drn = P.memDrain * dt;
  for (let J = 0; J < M; J++) {
    const r0 = MI0[J] * N, r1 = MI1[J] * N, fy = MF[J], row = J * M;
    for (let I = 0; I < M; I++) {
      const i0 = MI0[I], i1 = MI1[I], fx = MF[I];
      const a = Es[r0 + i0], b = Es[r0 + i1], c = Es[r1 + i0], d = Es[r1 + i1];
      const e = (a + (b - a) * fx) * (1 - fy) + (c + (d - c) * fx) * fy;
      const k = row + I;
      const activity = Math.min(1, Math.sqrt(Math.max(0, g2 * e)) * sc);
      const oldAdapt = adapted[k], dA = activity - oldAdapt;
      adapted[k] = oldAdapt + dA * (dA > 0 ? kRise : kFall);
      // changes in local vibration awaken colour; steady stimulation habituates and the memory drains away
      const novelty = Math.min(1, Math.abs(dA) * nov + (dA > 0 ? dA * ons : 0));
      const mv = memory[k] + novelty * chg - memory[k] * drn;
      memory[k] = mv < 0 ? 0 : mv > 1 ? 1 : mv;
    }
  }
}
let paletteFn = null;                 // host colour map (Spectro's), t∈[0,1] → [r,g,b]
const SPEC_RGB = new Uint8Array(256 * 3);
function drawMemory() {
  const d = mimg.data, ceil = P.memCeil;
  let pal = MEM_RGB;
  if (P.memPalette === 'spectro' && paletteFn) {
    for (let n = 0; n < 256; n++) { const c = paletteFn(n / 255); SPEC_RGB[n * 3] = c[0]; SPEC_RGB[n * 3 + 1] = c[1]; SPEC_RGB[n * 3 + 2] = c[2]; }
    pal = SPEC_RGB;
  }
  const ma = P.memAlpha, mo = P.memOpacity;
  for (let k = 0; k < MM; k++) {
    const t = memory[k], c = Math.round(t * ceil * 255) * 3, i = k * 4;
    d[i] = pal[c]; d[i + 1] = pal[c + 1]; d[i + 2] = pal[c + 2];
    d[i + 3] = Math.round(Math.min(mo, t * ma) * 255);
  }
  mctx.putImageData(mimg, 0, 0);
  ctx.save(); platePath(); ctx.clip();
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(mc, plate.x, plate.y, plate.w, plate.h);
  ctx.restore();
}
function wipeMemory() { memory.fill(0); adapted.fill(0); for (let i = 0; i < nP; i++) { sandAge[i] = 0; sandTravel[i] = 0; } }
const NOTES = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
function noteName(f) {
  const m = 69 + 12 * Math.log2(f / 440), r = Math.round(m), c = Math.round((m - r) * 100);
  return NOTES[((r % 12) + 12) % 12] + (Math.floor(r / 12) - 1) + ' ' + (c >= 0 ? '+' : '') + c + '¢';
}
let hostInfo = null, flash = '', flashT = 0;
function infoLine() {
  if (flash && performance.now() - flashT < 3500) return flash;
  let s = hostInfo ? hostInfo() + '  ' : '';
  if (peaks.length) {
    s += noteName(peaks[0].f) + '  ' + peaks[0].f.toFixed(1) + ' Hz';
    if (topMode) s += ' · mode ' + topMode.label + ' ' + topMode.f.toFixed(0) + ' Hz';
  } else s += P.material + ' ' + P.size + ' cm';
  if (hold) s += ' · held';
  return s;
}
function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#0d0c11'; ctx.fillRect(0, 0, W, H);
  ctx.font = '10px ui-monospace,Menlo,monospace'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.fillStyle = '#7d7689'; ctx.fillText(infoLine(), Math.max(8, plate.x), infoY);
  platePath(); ctx.fillStyle = '#24212b'; ctx.fill();
  if (P.memory) drawMemory();
  if (P.field > 0) drawField();
  drawGrains();
  platePath(); ctx.strokeStyle = '#3d3846'; ctx.lineWidth = 1; ctx.stroke();
  const mx = plate.x + P.dx * plate.w, my = plate.y + P.dy * plate.h;
  if (drag && drag.moved) {
    const r = cv.getBoundingClientRect(), fx0 = drag.x - r.left, fy0 = drag.y - r.top;
    ctx.strokeStyle = 'rgba(212,165,116,0.35)'; ctx.beginPath(); ctx.moveTo(fx0, fy0); ctx.lineTo(mx, my); ctx.stroke();
    ctx.beginPath(); ctx.arc(mx, my, 9, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(212,165,116,0.9)'; ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(mx, my, 3.5, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(212,165,116,0.8)'; ctx.stroke();
  if (P.strip) drawStrip();
}
let lastT = 0;
const DRAG_OFF = 56;                  // css px the marker floats above the finger while dragging
let drag = null;
function toPlate(cx, cy) {
  const r = cv.getBoundingClientRect();
  let u = (cx - r.left - plate.x) / plate.w, v = (cy - r.top - plate.y) / plate.h;
  if (P.shape === 'circle') {
    const dx = u - 0.5, dy = v - 0.5, d = Math.hypot(dx, dy);
    if (d > 0.48) { u = 0.5 + dx / d * 0.48; v = 0.5 + dy / d * 0.48; }
  } else { u = Math.max(0.01, Math.min(0.99, u)); v = Math.max(0.01, Math.min(0.99, v)); }
  return [u, v];
}
function setDrive(u, v) { P.dx = u; P.dy = v; req('couple'); }
function pointer(type, e) {
  if (type === 'down') {
    const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    if (x < plate.x - 12 || x > plate.x + plate.w + 12 || y < plate.y - 12 || y > plate.y + plate.h + 12) return false;
    drag = { sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY, moved: false };
    return true;
  }
  if (!drag) return false;
  drag.x = e.clientX; drag.y = e.clientY;
  if (Math.hypot(drag.x - drag.sx, drag.y - drag.sy) > 6) drag.moved = true;
  if (type === 'move') { if (drag.moved) setDrive(...toPlate(drag.x, drag.y - DRAG_OFF)); }
  else {   // up / cancel: a plain tap sets the exact point, a drag keeps the floated point
    if (type === 'up') setDrive(...(drag.moved ? toPlate(drag.x, drag.y - DRAG_OFF) : toPlate(drag.x, drag.y)));
    drag = null;
  }
  return true;
}
function resetDrive() { setDrive(0.5, 0.5); }
function tick(running, visible) {
  const now = performance.now(), dt = lastT ? Math.min(0.1, (now - lastT) / 1000) : 1 / 60;
  lastT = now;
  if (!hold) {
    if (running && an) { peaks = readPeaks(); updateField(peaks); }
    else if (peaks.length || domF) { peaks = []; updateField(peaks); }
  }
  if (!visible || !cv) return;
  smoothField();
  if (P.memory) updateMemory(dt);
  ribs(); step(dt); render();
}

/* ---- parameter changes ---- */
let pending = '';
function req(kind) {
  if (pending) { if (kind === 'build') pending = 'build'; return; }
  pending = kind;
  requestAnimationFrame(() => { const k = pending; pending = ''; if (k === 'couple') recouple(); else buildPlate(); });
}
function set(k, v) {
  P[k] = v;
  switch (k) {
    case 'shape': buildPlate(); scatter(); relayout(); break;
    case 'pitch': case 'size': case 'thick': case 'f0': retune(); break;
    case 'material': P.mu = MATERIALS[v].mu; req('build'); break;
    case 'mu': case 'order': req('build'); break;
    case 'aspect': if (P.shape === 'rect') { req('build'); relayout(); } break;
    case 'dx': case 'dy': req('couple'); break;
    case 'count': case 'powder': scatter(); break;
    case 'strip': relayout(); break;
    case 'tone': case 'toneOut': case 'toneHz': applyTone(); break;
  }
}
function init() { buildPlate(); scatter(); }
return {
  P, MATERIALS, set, init, attach, tap, tick, layout, setCanvas, scatter,
  toggleHold() { hold = !hold; return hold; },
  wipe: wipeMemory, pointer, resetDrive,
  setHostInfo(fn) { hostInfo = fn; }, setPalette(fn) { paletteFn = fn; },
  flash(s) { flash = s; flashT = performance.now(); },
  axisModes() {   // drivable modes for the spectrogram axis
    let cm = 1e-9; for (const m of modes) cm = Math.max(cm, Math.abs(m.c));
    return modes.filter(m => Math.abs(m.c) / cm >= 0.05).map(m => ({ f: m.f, c: Math.abs(m.c) / cm, label: m.label }));
  },
  plateImage() {  // the plate (memory + sand) as its own canvas
    const c = document.createElement('canvas'); c.width = Math.round(plate.w * dpr); c.height = Math.round(plate.h * dpr);
    c.getContext('2d').drawImage(cv, Math.round(plate.x * dpr), Math.round(plate.y * dpr), c.width, c.height, 0, 0, c.width, c.height);
    return c;
  },
  get plateRect() { return plate; }
};
})();

/* ───────── plate view, snapshot ───────── */
function plateLoop(){
  PLATE.tick(!!actx&&actx.state==='running', VIEW==='plate');
  requestAnimationFrame(plateLoop);
}
for(const b of document.querySelectorAll('#vsw button')) b.addEventListener('click',()=>{
  if(VIEW===b.dataset.v) return;
  VIEW=b.dataset.v;
  for(const x of document.querySelectorAll('#vsw button')) x.classList.toggle('on',x===b);
  syncTabs(); layout();
});
$('bHold').addEventListener('click',()=>{ $('bHold').classList.toggle('on',PLATE.toggleHold()); });
$('bScat').addEventListener('click',()=>{ PLATE.scatter(); PLATE.resetDrive(); });
$('bWipe').addEventListener('click',()=>PLATE.wipe());
$('bSend').addEventListener('click',async()=>{   // close the loop: plate picture → encoder → sound → plate
  const img=PLATE.plateImage();
  setSource(img,'plate snapshot');
  PLATE.flash('plate sent to Image · encoding…');
  try{ await encode(); PLATE.flash('plate encoded · press Play to hear it'); }
  catch(e){ PLATE.flash('could not encode the plate image'); }
});
{
  const pc=$('pcv');
  pc.addEventListener('pointerdown',e=>{ if(PLATE.pointer('down',e)){ pc.setPointerCapture(e.pointerId); e.preventDefault(); } });
  pc.addEventListener('pointermove',e=>{ PLATE.pointer('move',e); });
  pc.addEventListener('pointerup',e=>{ PLATE.pointer('up',e); });
  pc.addEventListener('pointercancel',e=>{ PLATE.pointer('cancel',e); });
}
PLATE.setHostInfo(()=>{
  if(busyMsg) return busyMsg;
  if(lastWarn&&performance.now()-lastWarnT<4000) return lastWarn;
  if(live) return 'mic';
  if(!cur) return 'idle';
  const nm=(cur.encoded?'encoded':(cur.name||'file').replace(/\.[^.]+$/,'').slice(0,16));
  return nm+' '+(playing?'▶ ':'❚❚ ')+pos.toFixed(1)+'/'+cur.dur.toFixed(1)+'s';
});
PLATE.setPalette(t=>{ let x=Math.pow(t,+P.vgamma); if(P.cinv) x=1-x; return cmapRGB(P.cmap,x); });
function snapView(){
  const r=$('view').getBoundingClientRect(), c=document.createElement('canvas');
  c.width=Math.round(r.width*dpr); c.height=Math.round(r.height*dpr);
  const x=c.getContext('2d'); x.fillStyle='#0d0c11'; x.fillRect(0,0,c.width,c.height);
  const was=curs.on; curs.on=false; draw();
  x.drawImage(VIEW==='plate'?$('pcv'):cv,0,0);
  curs.on=was;
  $('snapImg').src=c.toDataURL('image/png'); $('snapOv').style.display='flex';
}
$('bSnap').addEventListener('click',snapView);
function setFull(on){ document.body.classList.toggle('fs',on); }   // #view's ResizeObserver re-lays the plate out
$('bFull').addEventListener('click',()=>{ if(VIEW==='plate') setFull(true); });
$('fsExit').addEventListener('click',()=>setFull(false));
$('fsSnap').addEventListener('click',snapView);
$('snapOv').addEventListener('click',e=>{ if(e.target.id!=='snapImg') $('snapOv').style.display='none'; });
document.addEventListener('selectstart',e=>{ if(!(e.target&&e.target.id==='snapImg')) e.preventDefault(); });
document.addEventListener('contextmenu',e=>{ if(!(e.target&&e.target.id==='snapImg')) e.preventDefault(); });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&actx&&actx.state!=='running'&&(live||playing)) actx.resume(); });

/* ───────── saved state: every control, view, tabs, drive point, panel fold ─────────
   Kept in localStorage and written whenever something changes. Loaded files, images and the
   plate's memory picture are not saved. Stored values are checked against each control's
   current range/options, so an older save can't push a slider out of bounds. */
const STATE_KEY='spectroArtPlate.v1';
let stateOK=true, stateBlock=false, lastSaved='';
function stateSnapshot(){
  const p={}; for(const c of C) p[c.k]=P[c.k];
  return JSON.stringify({p,view:VIEW,tabs:lastTab,dx:PLATE.P.dx,dy:PLATE.P.dy,fold:$('deck').classList.contains('collapsed')});
}
function saveState(){
  if(stateBlock||!stateOK) return;
  const j=stateSnapshot(); if(j===lastSaved) return;
  try{ localStorage.setItem(STATE_KEY,j); lastSaved=j; }catch(e){ stateOK=false; }
}
function validVal(c,v){
  const ty=c.ty||'range';
  if(ty==='check') return typeof v==='boolean';
  if(ty==='select') return c.opts.some(o=>o[0]===v);
  return typeof v==='number'&&isFinite(v)&&v>=+c.min&&v<=+c.max;
}
function loadState(){   // returns 'restored', 'none' or 'unavailable'
  let raw=null;
  try{ raw=localStorage.getItem(STATE_KEY); }catch(e){ stateOK=false; return 'unavailable'; }
  if(!raw) return 'none';
  let st; try{ st=JSON.parse(raw); }catch(e){ return 'none'; }
  if(!st||typeof st!=='object') return 'none';
  if(st.p) for(const c of C) if(c.k in st.p&&validVal(c,st.p[c.k])) setParam(c.k,st.p[c.k]);
  if(st.view==='plate'||st.view==='spectro'){
    VIEW=st.view;
    for(const x of document.querySelectorAll('#vsw button')) x.classList.toggle('on',x.dataset.v===VIEW);
  }
  if(st.tabs){
    if(PLATE_TABS.includes(st.tabs.plate)) lastTab.plate=st.tabs.plate;
    if(TABS.some(t=>t[0]===st.tabs.spectro)&&!PLATE_TABS.includes(st.tabs.spectro)) lastTab.spectro=st.tabs.spectro;
  }
  for(const k of ['dx','dy']) if(typeof st[k]==='number'&&isFinite(st[k])) PLATE.P[k]=Math.max(0.01,Math.min(0.99,st[k]));
  if(st.fold){ $('deck').classList.add('collapsed'); fold(); }
  return 'restored';
}
function resetState(){
  stateBlock=true;
  try{ localStorage.removeItem(STATE_KEY); }catch(e){}
  location.reload();
}

/* ───────── boot ───────── */
buildUI();
const stateLoad=loadState();
for(const c of C) if(c.cat==='plate') PLATE.P[c.k.slice(3)]=P[c.k];
PLATE.setCanvas($('pcv'));
PLATE.init();
syncTabs();
new ResizeObserver(layout).observe($('view'));
document.addEventListener('gesturestart',e=>e.preventDefault());
layout();
setSource(testCard(),'test card');
encode();
requestAnimationFrame(plateLoop);
if(stateLoad==='restored') PLATE.flash('settings restored');
else if(stateLoad==='unavailable') PLATE.flash('settings can’t be saved in this app');
setInterval(saveState,1500);                       // cheap: only writes when something changed
window.addEventListener('pagehide',saveState);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) saveState(); });
})();
</script>
